<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9791a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Naam Counter">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>नाम काउंटर · Naam Counter</title>
<style>
:root{--bg:#fff8ee;--card:#fff;--ink:#3b2a14;--mute:#8a7557;--accent:#d9791a;--accent2:#f4b04a;--line:#ecd9bd;--ok:#2e8b57;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#1b140b;--card:#271c10;--ink:#f6e7cf;--mute:#b39a73;--accent:#f0932b;--accent2:#ffc46b;--line:#403019;--ok:#58c58a}}
:root[data-theme="night"]{--bg:#1b140b;--card:#271c10;--ink:#f6e7cf;--mute:#b39a73;--accent:#f0932b;--accent2:#ffc46b;--line:#403019;--ok:#58c58a}
:root[data-theme="krishna"]{--bg:#eef4ff;--card:#fff;--ink:#12233f;--mute:#5f7390;--accent:#2f6fd6;--accent2:#7fb0ff;--line:#cfdcf2;--ok:#2e8b57}
:root[data-theme="lotus"]{--bg:#fff0f5;--card:#fff;--ink:#3d1a2b;--mute:#8a5a70;--accent:#d6336c;--accent2:#ff8fb3;--line:#f4cddc;--ok:#2e8b57}
:root[data-theme="tulsi"]{--bg:#eefaf0;--card:#fff;--ink:#12301c;--mute:#5a7f66;--accent:#2e9b57;--accent2:#7fd69a;--line:#cde9d5;--ok:#1f7a45}
:root[data-theme="saffron"]{--bg:#fff8ee;--card:#fff;--ink:#3b2a14;--mute:#8a7557;--accent:#d9791a;--accent2:#f4b04a;--line:#ecd9bd;--ok:#2e8b57}
:root[data-theme="rudraksha"]{--bg:#fbeedb;--card:#fffaf2;--ink:#3a1f10;--mute:#8d6e55;--accent:#b5361b;--accent2:#e08a3c;--line:#ecd3b0;--ok:#2e8b57}
:root[data-theme="ganga"]{--bg:#eaf7fb;--card:#fff;--ink:#0f2f3a;--mute:#5b8795;--accent:#1a8fa8;--accent2:#7ad0e0;--line:#c6e5ee;--ok:#2e8b57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;margin:4px 0 12px}
.top h1{flex:1;text-align:center;font-size:18px;margin:0}
.mbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.name{font-size:24px;font-weight:700;text-align:center;color:var(--accent);word-break:break-word}
.sub{font-size:13px;color:var(--mute);text-align:center;margin-top:2px}
.count{font-size:48px;font-weight:800;text-align:center;margin:10px 0 4px;font-variant-numeric:tabular-nums;word-break:break-all}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.tap{position:relative;display:flex;align-items:center;justify-content:center;margin:10px auto 4px;width:min(70vw,250px);height:min(70vw,250px);border-radius:50%;border:0;color:#fff;font-size:22px;font-weight:700;background:radial-gradient(circle at 35% 30%,var(--accent2),var(--accent));box-shadow:0 10px 28px rgba(0,0,0,.22);touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .06s}
.tap:active{transform:scale(.95)}
.tap.flat{background:none;box-shadow:none;color:var(--accent);border-radius:20px}
.tap.flat #tl{font-size:20px}
#tl{position:relative;z-index:1}
.sv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sv .b{fill:var(--line)}
.sv.mala .b.lit{fill:#a9672b}.sv.mala .gb{fill:#a9672b}
.sv.rud .b{stroke:rgba(0,0,0,.15);stroke-width:.6}.sv.rud .b.lit{fill:#7e3318;stroke:#3a140a;stroke-width:.8}.sv.rud .gb{fill:#7e3318}
.sv .ts{fill:#b5361b}
.sv.flow .b.lit{fill:var(--accent)}
.sv.bub .b{fill:none;stroke:var(--line);stroke-width:1.3}.sv.bub .b.lit{fill:var(--accent2);stroke:var(--accent)}
.fk{transform-box:fill-box;transform-origin:50% 100%;animation:fk 1.2s ease-in-out infinite alternate}
@keyframes fk{from{transform:scale(1,1) rotate(-1.5deg)}to{transform:scale(.96,1.05) rotate(1.5deg)}}
.btns{display:flex;gap:8px;margin-top:12px}
button.s{flex:1;padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:14px}
button.s.danger{color:#c0392b}
button.s.armed{background:#c0392b;color:#fff;border-color:#c0392b}
button.s.run{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=range]{accent-color:var(--accent)}
input,.ta{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;margin-top:6px}
.ta{height:90px;font-size:12px;resize:vertical}
label{font-size:13px;color:var(--mute);display:block;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{padding:7px 11px;border-radius:20px;border:1px solid var(--line);font-size:13px;background:transparent;color:var(--ink)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1px solid rgba(0,0,0,.2)}
.sess{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
.sess .t{flex:1;min-width:0}
.sess .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .t span{font-size:12px;color:var(--mute)}
.sess.active b{color:var(--accent)}
.go{padding:9px 13px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-size:13px}
.x{padding:8px 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--mute);font-size:14px}
.x.armed{background:#c0392b;color:#fff}
.done{color:var(--ok);font-weight:700;text-align:center;font-size:14px;min-height:20px;margin-top:4px}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.edit{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.edit.on{display:block}
.gl{font-size:12px;color:var(--mute);margin:10px 0 2px;display:block}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:19}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;left:0;bottom:0;width:min(88vw,360px);background:var(--card);color:var(--ink);transform:translateX(-104%);transition:transform .25s;z-index:20;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:4px 0 24px rgba(0,0,0,.25)}
.dr.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;color:var(--accent)}
.dx{border:0;background:transparent;color:var(--ink);font-size:20px;padding:4px 8px}
.mi{border-bottom:1px solid var(--line)}
.mh{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 16px;background:none;border:0;color:var(--ink);font-size:15px;text-align:left}
.mh i{font-style:normal;color:var(--mute);transition:transform .2s}
.mi.open .mh i{transform:rotate(90deg)}
.mc{display:none;padding:0 16px 16px}
.mi.open .mc{display:block}
.bye{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);color:var(--ink);align-items:center;justify-content:center;text-align:center;padding:24px;flex-direction:column;gap:12px}
.bye.on{display:flex}
.bye h2{font-size:28px;margin:0;color:var(--accent)}

/* v3 */
.mh{transition:background .2s,color .2s}
.mi.open>.mh{background:linear-gradient(100deg,var(--accent),var(--accent2),var(--accent));background-size:220% 100%;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.35);animation:shm 2.6s linear infinite}
.mi.open>.mh i,.mi.open>.mh b{color:#fff!important}
@keyframes shm{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){.mi.open>.mh{animation:none}}
.mi.open>.mc{background:var(--bg);margin:0 10px 12px;padding:14px;border-radius:0 0 14px 14px;border:1px solid var(--accent);border-top:0;box-shadow:inset 0 4px 10px rgba(0,0,0,.07)}
#menu .mi{transition:opacity .2s,filter .2s}
#menu.has-open .mi:not(.open){opacity:.42;filter:blur(1.3px)}
.tap.bd{border:3px solid var(--accent);background:radial-gradient(circle at 50% 38%,var(--card),var(--bg));box-shadow:0 8px 22px rgba(0,0,0,.18),inset 0 0 0 5px var(--card)}
.tap.s-jyoti,.tap.s-bub{border-radius:50%}
.tap.s-flow{border-radius:26px}
.tap.bd .sv{inset:5%;width:90%;height:90%}
#undo{border-color:var(--accent);color:var(--accent);font-weight:600;background:rgba(127,127,127,.08)}
@supports (background:color-mix(in srgb,red,blue)){#undo{background:color-mix(in srgb,var(--accent) 14%,transparent)}}

/* v4 */
.inh{display:block;width:100%;padding:12px;border-radius:14px;border:0;color:#fff;font-size:15px;font-weight:700;margin:0 0 12px;background:linear-gradient(100deg,var(--accent),var(--accent2),var(--accent));background-size:220% 100%;text-shadow:0 1px 2px rgba(0,0,0,.35);animation:shm 2.2s linear infinite}
.tmd{flex:1;text-align:center;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.tmd.on{color:var(--accent);border-color:var(--accent);animation:glw 1.4s ease-in-out infinite}
@keyframes glw{0%,100%{box-shadow:0 0 4px 0 var(--accent)}50%{box-shadow:0 0 18px 5px var(--accent2)}}
button:disabled{opacity:.4}
.mbtn.off{opacity:.55}
.tap.bd #tl{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:7px 18px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.25);text-shadow:0 1px 2px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){.inh,.tmd.on,button.s.run{animation:none}}

/* v5 */
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--ang:360deg}}
button.s.run{border:3px solid transparent;padding:9px 6px;color:#fff;background:linear-gradient(var(--accent),var(--accent)) padding-box,conic-gradient(from var(--ang),var(--accent) 0deg,var(--accent) 190deg,var(--accent2) 265deg,#fff 330deg,var(--accent) 360deg) border-box;animation:spin 2s linear infinite}
.tap.flat{border-radius:50%}
.tap.s-flow{border-radius:26px}
#rs{border-color:#c0392b;background:rgba(192,57,43,.1);font-weight:600}
#rs.armed{background:#c0392b;color:#fff}
@media (prefers-reduced-motion:reduce){.tap.bd #tl,button.s.run{animation:none}}
/* v6 */
.tap.bd #tl{border:2px solid transparent;padding:5px 16px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2)) padding-box,conic-gradient(from var(--ang),var(--accent) 0deg,var(--accent) 180deg,var(--accent2) 260deg,#fff 330deg,var(--accent) 360deg) border-box;animation:spin 2.2s linear infinite}
/* v7 */
.sl{position:relative;height:36px;margin:10px 4px 0;pointer-events:none}
.sl::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--line)}
.sl .sf{position:absolute;left:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.sl .st{position:absolute;top:0;width:32px;height:32px;margin-top:2px;border-radius:50%;background:var(--accent);border:3px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.3);pointer-events:auto;touch-action:none;cursor:grab}
.sl .st.drag{cursor:grabbing;box-shadow:0 0 0 7px rgba(127,127,127,.22),0 2px 8px rgba(0,0,0,.3)}
.sl .st:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
.ap{display:none;margin-top:10px;padding:12px;border-radius:14px;border:1px solid var(--accent);background:var(--bg)}
.ap.on{display:block}
.tmrow{display:none;align-items:stretch;gap:8px;margin-top:12px}
.tmrow .tmd{flex:1;margin:0}
.tmd.off{opacity:.5}
button.s.tmb{flex:0 0 62px;padding:6px 0;border:2px solid var(--accent);color:var(--accent);background:transparent;font-weight:700}
button.s.tmb.fill{background:var(--accent);color:#fff}
button.s.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
#bsp{border-color:#c0392b}
.tap.s-jyoti,.tap.s-flow,.tap.s-bub{align-items:flex-end;padding-bottom:22px}
/* v8 */
.tap.bd #tl{border:0;padding:7px 18px;background:linear-gradient(135deg,var(--accent),var(--accent2));animation:none}
.tmrow{flex-direction:column;align-items:stretch;gap:0}
.tmrow .tmd{flex:none;width:100%}
.tm3{display:flex;gap:8px;margin-top:8px}
.tm3 .tmb,button.s.tmb{flex:1 1 0;padding:11px 4px;font-size:15px;font-weight:700;border:2px solid var(--accent);color:var(--accent);background:transparent}
button.s.tmb.tmgreen{border-color:#2e8b57;color:#2e8b57;background:rgba(46,139,87,.12)}
button.s.tmb.tmred{border-color:#c0392b;color:#c0392b;background:rgba(192,57,43,.12)}
#tmgo{background:var(--accent);color:#fff;border-color:var(--accent)}
.tmd.on{border:2px solid transparent;box-shadow:none;color:var(--accent);background:linear-gradient(var(--bg),var(--bg)) padding-box,conic-gradient(from var(--ang),var(--accent) 0deg,var(--accent) 190deg,var(--accent2) 265deg,#fff 330deg,var(--accent) 360deg) border-box;animation:spin 2s linear infinite}
/* v9 */
.sec+.sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sech{font-size:13px;font-weight:700;color:var(--ink);text-align:center;margin:0 0 10px}
.tmg{display:grid;grid-template-columns:1fr 1.6fr 1fr;grid-template-rows:auto auto;gap:8px}
#tmtg{grid-column:1;grid-row:1/3;align-self:stretch}
#tmgo{grid-column:3;grid-row:1/3;align-self:stretch}
#tmd,#tmi2{grid-column:2;grid-row:1;width:100%;margin:0;font-family:inherit}
#tmd{font-size:22px}
#tmi2{text-align:center;font-size:22px;font-weight:800;padding:10px;border:2px solid var(--accent);display:none}
.tmpm{grid-column:2;grid-row:2;display:flex;gap:8px}
.tmpm .s{flex:1;padding:8px 0;font-size:20px;font-weight:700}
.pg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pg3 .chip{text-align:center;padding:9px 0;font-size:14px}
/* v10 */
.tmhead{display:flex;align-items:center;justify-content:center;gap:12px}
.swt{position:relative;width:48px;height:26px;border-radius:14px;border:2px solid #c0392b;padding:0;background:linear-gradient(#2e8b57,#2e8b57) no-repeat 0 0/0% 100%;transition:background-size .4s ease,border-color .4s ease;cursor:pointer;flex:none}
.swt i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#c0392b;transition:transform .35s ease,background .35s ease;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.swt.on{background-size:100% 100%;border-color:#2e8b57}
.swt.on i{transform:translateX(22px);background:#fff}
.tmr3{display:flex;gap:8px;align-items:stretch}
.tmr3 .tmd{flex:1;width:auto;grid-column:auto;text-align:center}
.tmr3 .s{flex:0 0 58px;font-size:22px;font-weight:700;padding:8px 0}
#tmd{grid-column:auto;grid-row:auto}
#tmgo{grid-column:auto;grid-row:auto;width:100%;margin-top:10px;padding:12px}
</style>
</head>
<body>
<main>
<div class="top"><button class="mbtn" id="mb" aria-label="Menu">☰</button><h1 data-i="title"></h1><button class="mbtn" id="snb" data-ns aria-label="Sound"></button></div>
<button class="inh" id="inh"><span data-i="inst2"></span></button>

<div class="card">
  <div class="name" id="nm"></div>
  <div class="sub" id="sb"></div>
  <div class="count" id="ct">0</div>
  <div class="bar"><i id="pg"></i></div>
  <div class="row"><span id="pc">0%</span><span id="tg">&nbsp;</span></div>
  <div class="done" id="dn"></div>
  <button class="tap" id="tap"><svg id="tsv" class="sv" viewBox="0 0 260 270"></svg><span id="tl"></span></button>
  <div class="btns"><button class="s" id="au"></button></div>
  <div class="ap" id="apn">
    <div class="sec">
      <div class="sech tmhead"><span data-i="tm_sec"></span><button class="swt" id="tmsw" role="switch" aria-checked="false" aria-label="Timer"><i></i></button></div>
      <div class="tmr3"><button class="s" id="tmm">−</button><div class="tmd" id="tmd"></div><button class="s" id="tmp">+</button></div>
      <button class="s tmb" id="tmgo"></button>
      <div class="done" id="tmf" style="margin-top:6px"></div>
      <div class="hint" data-i="tm_hint2" style="text-align:center;margin-top:0"></div>
    </div>
    <div class="sec"><div id="sp_main"></div></div>
  </div>
  <div class="hint" id="ah" style="text-align:center"></div>
  <div class="btns">
    <button class="s" id="undo" data-i="undo"></button>
    <button class="s" id="rn" data-i="edit"></button>
    <button class="s danger" id="rs"></button>
  </div>
  <div class="edit" id="ed">
    <label data-i="name"></label>
    <input id="en" maxlength="60">
    <label data-i="tlabel"></label>
    <input id="et" type="number" inputmode="numeric" min="1" data-ph="tph">
    <label data-i="setc"></label>
    <input id="ec" type="number" inputmode="numeric" min="0" data-ph="cph">
    <div class="btns"><button class="s" id="ecancel" data-i="cancel"></button><button class="go" id="esave" style="flex:1" data-i="save"></button></div>
  </div>
</div>

</main>

<div class="ov" id="ov"></div>
<aside class="dr" id="dr">
  <div class="dh"><span data-i="menu"></span><button class="dx" id="dx" aria-label="Close">✕</button></div>
  <nav id="menu">
    <div class="mi"><button class="mh"><span data-i="m_speed"></span><i>›</i></button>
      <div class="mc"><div id="sp_menu"></div></div></div>

    <div class="mi"><button class="mh"><span data-i="m_new"></span><i>›</i></button>
      <div class="mc">
        <label data-i="quick" style="margin-top:0"></label>
        <div class="chips" id="nchips"></div>
        <label data-i="nname"></label>
        <input id="nn" maxlength="60" data-ph="nph">
        <label data-i="ntarget"></label>
        <div class="chips" id="chips"></div>
        <input id="nt" type="number" inputmode="numeric" min="1" data-ph="cust">
        <button class="go" id="add" style="width:100%;margin-top:12px;padding:12px;font-size:15px" data-i="start"></button>
        <div class="hint" data-i="hint"></div>
      </div></div>

    <div class="mi"><button class="mh"><span data-i="m_old"></span><i>›</i></button>
      <div class="mc"><div id="list"></div></div></div>

    <div class="mi"><button class="mh"><span data-i="m_bk"></span><i>›</i></button>
      <div class="mc">
        <div class="hint" data-i="bkh" style="margin:0 0 10px"></div>
        <button class="go" id="bkb" style="width:100%;padding:12px" data-i="bkb"></button>
        <textarea class="ta" id="bkt" data-ph="bkph" style="margin-top:10px"></textarea>
        <div class="hint" id="bkm"></div>
      </div></div>

    <div class="mi"><button class="mh" id="lgb"><span data-i="m_lang"></span><b id="lgv" style="color:var(--accent);font-weight:600"></b></button></div>

    <div class="mi"><button class="mh"><span data-i="m_sv"></span><i>›</i></button>
      <div class="mc">
        <div class="chips">

  d.sessions.forEach(function(x){if(!x||typeof x.id!=="string"||typeof x.name!=="string")return;
   var o={id:x.id.slice(0,40),name:x.name.slice(0,60),count:Math.max(0,Math.min(1e12,Math.floor(Number(x.count)||0))),target:Math.max(0,Math.min(1e12,Math.floor(Number(x.target)||0)))};
   if(typeof x.gap==="number"&&x.gap>0&&x.gap<=60)o.gap=x.gap;
   var k=-1;S.sessions.forEach(function(y,i){if(y.id===o.id)k=i});if(k>=0)S.sessions[k]=o;else S.sessions.push(o);n++});
  if(d.theme&&TH.some(function(h){return h[0]===d.theme}))S.theme=d.theme;
  if(d.style&&STY.indexOf(d.style)>=0)S.style=d.style;
  if(d.snds)["c","b","m"].forEach(function(k){var v2=+d.snds[k];if((v2>=0&&v2<5)||v2===-1)S.snds[k]=v2});
  if(typeof d.timer==="number"&&d.timer>=1&&d.timer<=60)S.timer=Math.floor(d.timer);
  if(d.lang==="hi"||d.lang==="en")S.lang=d.lang;
  if(!cur()&&S.sessions.length)S.active=S.sessions[0].id;
  save();render();$("rsm").textContent=t("bkdone")+n}
 catch(e){$("rsm").textContent=t("bkbad")}};
/* ---- install ---- */
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();DP=e});
window.addEventListener("appinstalled",function(){S.installed=true;save();$("mi_in").style.display="none";$("inh").style.display="none"});
if((window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone)S.installed=true;
$("mi_in").style.display="none";$("inh").style.display="none";
function chkInst(){if((window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone){S.installed=true;save()}if(!S.installed){$("mi_in").style.display="";$("inh").style.display=""}}
function showInstall(){dopen(true);all(".mi").forEach(function(m){m.classList.remove("open")});$("mi_in").classList.add("open");syncOpen();ihOpen=true;$("ih").style.display="block";$("ib").style.display="flex";instUI();try{$("mi_in").scrollIntoView({block:"center"})}catch(e){}}
$("inh").onclick=function(){if(DP){DP.prompt();DP.userChoice.then(function(r){DP=null;if(r&&r.outcome==="accepted"){S.installed=true;save();$("inh").style.display="none";$("mi_in").style.display="none"}}).catch(function(){});return}showInstall()};
$("instb").onclick=function(){
 if(DP){DP.prompt();DP.userChoice.then(function(){DP=null}).catch(function(){});return}
 ihOpen=!ihOpen;$("ih").style.display=ihOpen?"block":"none";$("ib").style.display=ihOpen?"flex":"none";instUI()};
$("cp").onclick=function(){var u=location.href;var done=function(){$("cp").textContent=t("copied");setTimeout(instUI,1800)};
 try{navigator.clipboard.writeText(u).then(done,function(){})}catch(e){}};
/* ---- exit ---- */
$("exn").onclick=function(){all(".mi").forEach(function(m){m.classList.remove("open")});syncOpen()};
$("exy").onclick=function(){stopAuto();stopKeep();dopen(false);try{window.close()}catch(e){}$("bye").classList.add("on")};
$("byeb").onclick=function(){$("bye").classList.remove("on")};

load();render();chkInst();wake();
