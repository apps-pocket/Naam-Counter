<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plate Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1F6F66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plate Planner">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4F0;--card:#fff;--ink:#17302C;--mute:#5d7570;--teal:#1F6F66;--tealL:#d9ece7;--mango:#F5B335;--plum:#7A2E5B;--line:#d3e0db;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c1a;--card:#172a27;--ink:#e6f1ee;--mute:#92aaa4;--teal:#4cc2b2;--tealL:#1d3a36;--plum:#d58ab6;--line:#2a423e}}
:root[data-theme="dark"]{--bg:#0f1c1a;--card:#172a27;--ink:#e6f1ee;--mute:#92aaa4;--teal:#4cc2b2;--tealL:#1d3a36;--plum:#d58ab6;--line:#2a423e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'DM Sans',system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 50px}
h1{font:800 1.7rem 'Bricolage Grotesque',sans-serif;margin:4px 0 12px;letter-spacing:-.02em}
h1 span{color:var(--teal)}
h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0}
.tabs{display:flex;gap:6px;background:var(--tealL);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--ink);padding:9px;border-radius:9px;font:600 .9rem 'DM Sans';cursor:pointer}
.tabs button.on{background:var(--teal);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.btn{border:1px solid var(--teal);background:none;color:var(--teal);padding:7px 12px;border-radius:9px;font:600 .82rem 'DM Sans';cursor:pointer}
.btn.fill{background:var(--teal);color:#fff}
.mute{color:var(--mute);font-size:.82rem}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0 14px}
.day{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 0;text-align:center;cursor:pointer;font:inherit}
.day b{display:block;font-size:1.05rem}.day small{color:var(--mute);font-size:.68rem}
.day.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
.day.now small:first-child{color:var(--teal);font-weight:700}
.stage{position:relative;border-radius:14px;overflow:hidden;min-height:260px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;border-radius:14px}
.slot{margin-bottom:10px}
.slot h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--teal)}
.item{padding:3px 0;font-size:1rem}.item i{font-style:normal;color:var(--mute);font-size:.72rem;margin-left:6px}
.tr{display:flex;gap:6px;margin-top:8px}
.tr button{border:1px solid var(--line);background:none;color:var(--mute);padding:5px 10px;border-radius:20px;font:600 .78rem 'DM Sans';cursor:pointer}
.tr button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.tr button.lk.on{background:var(--plum);border-color:var(--plum)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--tealL);border-radius:20px;padding:4px 6px 4px 11px;font-size:.85rem;display:flex;gap:5px;align-items:center}
.chip button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:1rem;line-height:1}
form{display:flex;gap:6px}
input,select{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.al{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.al:last-child{border:0}.al b{font:800 1.15rem 'Bricolage Grotesque'}
.al.med b{color:var(--plum)}
.sw{width:42px;height:24px;border-radius:12px;background:var(--line);border:0;position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--teal)}.sw.on::after{left:21px}
#ban{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--mango);color:#3a2700;border-radius:12px;padding:12px 14px;font-weight:700;display:none;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="ban"></div>
<div class="wrap">
<h1>Plate <span>Planner</span></h1>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=[['bf','Breakfast'],['mm','Mid-morning'],['lu','Lunch'],['sn','Tea & snacks'],['di','Dinner'],['so','Soups'],['ve','Vegetables & nutrition']];
const SLOTS=[['bf','Breakfast',['bf']],['mm','Mid-morning',['mm']],['lu','Lunch',['lu','ve']],['sn','Tea & snacks',['sn']],['di','Dinner',['di','so']]];
const DN=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DEF={bf:['Poha','Upma','Idli with sambar','Vegetable paratha','Besan chilla','Oats porridge','Moong dal cheela','Dalia','Sprouts salad bowl'],
mm:['Apple','Banana','Papaya','Orange','Soaked almonds & walnuts','Pomegranate','Coconut water','Guava'],
lu:['Dal, rice & salad','Rajma chawal','Roti with sabzi & curd','Vegetable khichdi','Kadhi chawal','Chole with roti','Vegetable pulao & raita','Paneer bhurji wrap'],
sn:['Chai & roasted makhana','Chai & khakhra','Sprouts chaat','Roasted chana','Fruit chaat','Vegetable sandwich','Corn chaat','Murmura bhel'],
di:['Palak paneer & roti','Mixed veg & roti','Dal tadka & jeera rice','Stuffed paratha & curd','Vegetable daliya','Lauki sabzi & roti','Besan gatta & roti','Moong dal khichdi'],
so:['Tomato soup','Sweet corn soup','Mixed vegetable soup','Lemon coriander soup','Palak soup','Pumpkin soup','Moong dal soup'],
ve:['Cucumber-carrot salad','Steamed broccoli','Sauteed spinach','Beetroot salad','Sprouted moong','Lauki sabzi','Bhindi fry']};
const PRE=[['Breakfast','08:00','meal'],['Fruit / mid-morning','10:30','meal'],['Lunch','13:00','meal'],['Tea & snacks','17:00','meal'],['Dinner','20:00','meal'],['Medicine','09:00','med']];
let S,view='plan',off=0,selDate=null;
try{S=JSON.parse(localStorage.getItem('plate-v1'))}catch(e){}
S=S||{bank:JSON.parse(JSON.stringify(DEF)),plans:{},track:{},revealed:{},alarms:[]};
const save=()=>{try{localStorage.setItem('plate-v1',JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mon=d=>{d=new Date(d);d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function gen(prev){
 const used={};if(prev)prev.forEach(d=>Object.values(d).flat().forEach(i=>(used[i.c]=used[i.c]||new Set()).add(i.t)));
 const seq={};CATS.forEach(([c])=>{const u=used[c]||new Set(),p=shuf(S.bank[c]||[]);seq[c]=[...p.filter(x=>!u.has(x)),...p.filter(x=>u.has(x))]});
 return Array.from({length:7},(_,i)=>{const d={};SLOTS.forEach(([s,,cs])=>{d[s]=cs.map(c=>seq[c].length?{c,t:seq[c][i%seq[c].length]}:null).filter(Boolean)});return d})}
const weekStart=o=>{const m=mon(new Date());m.setDate(m.getDate()+o*7);return m};
function plan(o,force){const m=weekStart(o),k=iso(m),p=new Date(m);p.setDate(p.getDate()-7);
 if(!S.plans[k]||force){S.plans[k]=gen(S.plans[iso(p)]);save()}return S.plans[k]}
const tk=(dk,s)=>((S.track[dk]=S.track[dk]||{})[s]=S.track[dk][s]||{});
function render(){
 $('#tabs').innerHTML=[['plan','My week'],['meals','Meal bank'],['alarms','Alarms']].map(([v,l])=>`<button class="${view==v?'on':''}" data-act="tab" data-v="${v}">${l}</button>`).join('');
 ({plan:rPlan,meals:rMeals,alarms:rAlarms})[view]()}
function rPlan(){
 const m=weekStart(off),P=plan(off),today=iso(new Date()),dates=DN.map((_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return d});
 if(!selDate||!dates.some(d=>iso(d)==selDate))selDate=dates.some(d=>iso(d)==today)?today:iso(dates[0]);
 const si=dates.findIndex(d=>iso(d)==selDate),sd=dates[si],end=dates[6],f=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
 let fol=0,lik=0;dates.forEach(d=>Object.values(S.track[iso(d)]||{}).forEach(t=>{fol+=t.d?1:0;lik+=t.l?1:0}));
 const rev=S.revealed[selDate];
 const slots=SLOTS.map(([s,l])=>{const t=tk(selDate,s);return `<div class="slot"><h3>${l}</h3>${P[si][s].map(i=>`<div class="item">${esc(i.t)}${i.c=='so'||i.c=='ve'?`<i>${i.c=='so'?'soup':'side'}</i>`:''}</div>`).join('')||'<div class="mute">Nothing in the bank for this yet</div>'}
 <div class="tr"><button class="${t.d?'on':''}" data-act="done" data-s="${s}">${t.d?'✓ Followed':'Followed this?'}</button><button class="lk ${t.l?'on':''}" data-act="like" data-s="${s}">♥ ${t.l?'Liked':'Liked it?'}</button></div></div>`}).join('');
 $('#app').innerHTML=`<div class="row"><button class="btn" data-act="wk" data-d="-1">‹</button><div class="sp" style="text-align:center"><h2>${f(m)} – ${f(end)}</h2><div class="mute">${fol} followed · ${lik} liked this week</div></div><button class="btn" data-act="wk" data-d="1">›</button></div>
 <div class="days">${dates.map(d=>`<button class="day ${iso(d)==selDate?'sel':''} ${iso(d)==today?'now':''}" data-act="pick" data-k="${iso(d)}"><small>${DN[(d.getDay()+6)%7].slice(0,3)}</small><b>${d.getDate()}</b><small>${Object.values(S.track[iso(d)]||{}).filter(t=>t.d).length}/5</small></button>`).join('')}</div>
 <div class="row" style="margin-bottom:8px"><h2>${DN[si]}, ${f(sd)}</h2><span class="sp"></span><button class="btn" data-act="shuffle">Shuffle week</button></div>
 <div class="card stage" id="stage">${slots}${rev?'':'<canvas id="cv"></canvas>'}</div>
 ${rev?'':'<div class="row"><span class="mute sp">Scratch the gold with your finger.</span><button class="btn" data-act="reveal">Reveal</button></div>'}`;
 if(!rev)scratch($('#cv'),selDate)}
function scratch(cv,dk){
 const r=cv.parentElement.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
 const x=cv.getContext('2d');x.scale(dpr,dpr);
 const g=x.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,'#F5B335');g.addColorStop(.5,'#FFD777');g.addColorStop(1,'#E39B14');
 x.fillStyle=g;x.fillRect(0,0,r.width,r.height);x.fillStyle='#5a3b00';x.font='800 18px "Bricolage Grotesque",sans-serif';x.textAlign='center';
 x.fillText('Scratch to reveal the plate',r.width/2,r.height/2);x.globalCompositeOperation='destination-out';
 let down=0,n=0;
 const chk=()=>{const d=x.getImageData(0,0,cv.width,cv.height).data;let c=0,t=0;for(let i=3;i<d.length;i+=64){t++;if(d[i]<20)c++}if(c/t>.45){S.revealed[dk]=1;save();render()}};
 const pt=e=>{const b=cv.getBoundingClientRect();x.beginPath();x.arc(e.clientX-b.left,e.clientY-b.top,24,0,7);x.fill();if(++n%8==0)chk()};
 cv.onpointerdown=e=>{down=1;cv.setPointerCapture(e.pointerId);pt(e)};cv.onpointermove=e=>{if(down)pt(e)};cv.onpointerup=()=>{down=0;chk()}}
function rMeals(){
 $('#app').innerHTML=`<p class="mute">Add what you usually cook. The week plan picks from these, and avoids repeats.</p>`+CATS.map(([c,l])=>`<div class="card"><h3>${l}</h3><div class="chips">${(S.bank[c]||[]).map((t,i)=>`<span class="chip">${esc(t)}<button data-act="rm" data-c="${c}" data-i="${i}" aria-label="Remove">×</button></span>`).join('')}</div>
 <form data-c="${c}"><input placeholder="Add to ${l.toLowerCase()}…" maxlength="60" required><button class="btn fill">Add</button></form></div>`).join('')+`<button class="btn" data-act="reset">Restore example meals</button>`}
function rAlarms(){
 const A=[...S.alarms].sort((a,b)=>a.t.localeCompare(b.t));
 $('#app').innerHTML=`<div class="card"><h3>Quick add</h3><div class="chips">${PRE.map((p,i)=>`<span class="chip" style="padding:4px 11px;cursor:pointer" data-act="pre" data-i="${i}">+ ${p[0]} ${p[1]}</span>`).join('')}</div>
 <form id="af"><input name="l" placeholder="Label, e.g. Vitamin D" required maxlength="40"><input name="t" type="time" required style="flex:0 0 110px"><select name="k" style="flex:0 0 100px"><option value="meal">Meal</option><option value="med">Medicine</option></select><button class="btn fill">Add</button></form></div>
 <div class="card">${A.map(a=>`<div class="al ${a.k}"><b>${a.t}</b><span class="sp">${esc(a.l)}<div class="mute">${a.k=='med'?'Medicine':'Meal'} · every day</div></span><button class="sw ${a.on?'on':''}" data-act="sw" data-id="${a.id}" aria-label="Toggle"></button><button class="chip" style="border:0" data-act="del" data-id="${a.id}" aria-label="Delete">×</button></div>`).join('')||'<div class="mute">No alarms yet. Tap a quick-add above.</div>'}</div>
 <div class="row"><button class="btn" data-act="perm">Allow notifications</button><span class="mute sp">Alarms ring only while this page is open.</span></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
 if(a=='tab')view=d.v;
 else if(a=='wk'){off+=+d.d;selDate=null}
 else if(a=='pick')selDate=d.k;
 else if(a=='shuffle')plan(off,true);
 else if(a=='reveal'){S.revealed[selDate]=1}
 else if(a=='done'||a=='like'){const t=tk(selDate,d.s);if(a=='done')t.d=!t.d;else t.l=!t.l}
 else if(a=='rm')S.bank[d.c].splice(+d.i,1);
 else if(a=='reset')S.bank=JSON.parse(JSON.stringify(DEF));
 else if(a=='pre'){const p=PRE[+d.i];S.alarms.push({id:Date.now()+'',l:p[0],t:p[1],k:p[2],on:true})}
 else if(a=='sw'){const x=S.alarms.find(x=>x.id==d.id);x.on=!x.on}
 else if(a=='del')S.alarms=S.alarms.filter(x=>x.id!=d.id);
 else if(a=='perm'){try{Notification.requestPermission()}catch(_){}return}
 save();render()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id=='af'){const v=new FormData(f);S.alarms.push({id:Date.now()+'',l:v.get('l'),t:v.get('t'),k:v.get('k'),on:true})}
 else{const v=f.querySelector('input').value.trim();if(!v)return;(S.bank[f.dataset.c]=S.bank[f.dataset.c]||[]).push(v)}
 save();render()});
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.25);o.start(c.currentTime+t);o.stop(c.currentTime+t+.3)})}catch(e){}}
function fire(a){const b=$('#ban');b.textContent=(a.k=='med'?'Time for your medicine: ':'Time for ')+a.l+'  (tap to dismiss)';b.style.display='block';b.onclick=()=>b.style.display='none';beep();
 try{if(Notification.permission=='granted')new Notification('Plate Planner',{body:a.l})}catch(e){}}
setInterval(()=>{const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),k=iso(n)+hm;
 S.alarms.forEach(a=>{if(a.on&&a.t==hm&&a.last!=k){a.last=k;fire(a);save()}})},15000);
render();
</script>
</body>
</html>
